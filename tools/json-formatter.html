<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator — OpenUtility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090B10; --bg2: #0E121B; --bg3: #141A26;
      --card-bg: rgba(20, 26, 38, 0.7); --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.15); --text: #F1F5F9; --text2: #94A3B8;
      --text3: #64748B; --sky: #4A9EE8; --sky2: #38BDF8; --green: #3DCC8E;
      --red: #FF5C5C; --max-w: 1100px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    .back-nav { width: 100%; max-width: var(--max-w); margin-bottom: 20px; }
    .back-link { color: var(--text2); text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .back-link:hover { color: var(--text); }

    .tool-container { width: 100%; max-width: var(--max-w); background: var(--card-bg); border: 1px solid var(--border2); border-radius: 16px; padding: 32px; backdrop-filter: blur(20px); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.desc { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

    .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media(max-width: 800px) { .editor-layout { grid-template-columns: 1fr; } }

    .editor-pane { display: flex; flex-direction: column; gap: 8px; }
    .pane-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--text3); text-transform: uppercase; }
    
    textarea {
      width: 100%; height: 380px; background: var(--bg); border: 1px solid var(--border2);
      border-radius: 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px;
      padding: 16px; resize: vertical; outline: none; transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--sky); }

    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .btn-group { display: flex; gap: 10px; }
    
    .btn-action { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); padding: 10px 18px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-action:hover { background: rgba(255,255,255,0.06); border-color: var(--sky); }
    .btn-primary { background: linear-gradient(135deg, var(--sky), #2563EB); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-primary:hover { opacity: 0.9; }

    .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
    .valid { color: var(--green); border-color: rgba(61, 204, 142, 0.3); }
    .invalid { color: var(--red); border-color: rgba(255, 92, 92, 0.3); }
  </style>
</head>
<body>

  <div class="back-nav">
    <a href="../index.html" class="back-link">← Back to Dashboard</a>
  </div>

  <div class="tool-container">
    <h1>JSON Formatter & Validator</h1>
    <p class="desc">Parse, syntax check, beautify, and minify your JSON objects securely within your browser sandbox.</p>

    <div class="editor-layout">
      <div class="editor-pane">
        <div class="pane-header">
          <span>Input Payload</span>
          <span id="inputStats">0 lines</span>
        </div>
        <textarea id="jsonInput" placeholder="Paste your raw JSON string here..." oninput="processJson()"></textarea>
      </div>

      <div class="editor-pane">
        <div class="pane-header">
          <span>Formatted Output</span>
          <span id="outputStats" class="status-badge">Waiting for input</span>
        </div>
        <textarea id="jsonOutput" readonly placeholder="Formatted output will appear here..."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button class="btn-primary" onclick="formatJson(2)">Prettify (2 Spaces)</button>
        <button class="btn-action" onclick="formatJson(4)">Prettify (4)</button>
        <button class="btn-action" onclick="minifyJson()">Minify</button>
      </div>
      <button class="btn-action" onclick="copyOutput()">Copy Result</button>
    </div>
  </div>

  <script>
    function processJson() {
      const input = document.getElementById('jsonInput').value;
      const statusBadge = document.getElementById('outputStats');
      const lines = input.split('\n').length;
      document.getElementById('inputStats').innerText = lines + (lines === 1 ? ' line' : ' lines');

      if (!input.trim()) {
        document.getElementById('jsonOutput').value = '';
        statusBadge.className = 'status-badge';
        statusBadge.innerText = 'Waiting for input';
        return;
      }

      try {
        const parsed = JSON.parse(input);
        statusBadge.className = 'status-badge valid';
        statusBadge.innerText = 'Valid JSON ✓';
      } catch (err) {
        statusBadge.className = 'status-badge invalid';
        statusBadge.innerText = 'Syntax Error ✕';
      }
    }

    function formatJson(spaces) {
      const input = document.getElementById('jsonInput').value;
      try {
        const parsed = JSON.parse(input);
        document.getElementById('jsonOutput').value = JSON.stringify(parsed, null, spaces);
        document.getElementById('outputStats').className = 'status-badge valid';
        document.getElementById('outputStats').innerText = 'Formatted Successfully';
      } catch (err) {
        alert('Cannot format: Invalid JSON syntax detected.');
      }
    }

    function minifyJson() {
      const input = document.getElementById('jsonInput').value;
      try {
        const parsed = JSON.parse(input);
        document.getElementById('jsonOutput').value = JSON.stringify(parsed);
        document.getElementById('outputStats').className = 'status-badge valid';
        document.getElementById('outputStats').innerText = 'Minified Successfully';
      } catch (err) {
        alert('Cannot minify: Invalid JSON syntax detected.');
      }
    }

    function copyOutput() {
      const output = document.getElementById('jsonOutput');
      if (!output.value) return;
      navigator.clipboard.writeText(output.value);
      alert('Output copied to clipboard!');
    }
  </script>
</body>
</html>
